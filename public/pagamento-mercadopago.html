<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Mercado Pago — DAMA'S SECRETA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <style>
    :root {
      --green: #16A34A; --green-dark: #15803D;
      --blue: #009EE3; --blue-dark: #0080BC;
      --rose: #E8518A; --rose-dark: #C93D72;
      --bg: #FFF8FA; --card: #fff;
      --text: #1A0A12; --text-2: #6B3A56; --muted: #B08EA0; --border: #F0D4E5;
      --radius: 18px; --shadow: 0 1px 4px rgba(180,50,100,.07), 0 6px 20px rgba(180,50,100,.07);
    }
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .pay-header { background: var(--blue); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .pay-logo { font-family: Georgia, serif; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: .04em; }
    .pay-logo span { color: #D6F0FF; }
    .pay-hdr-right { font-size: 12px; color: rgba(255,255,255,.85); font-weight: 500; }

    .pay-shell { width: min(480px, 100%); margin: 0 auto; padding: 20px 14px 56px; display: flex; flex-direction: column; gap: 14px; }
    .pay-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; padding: 28px 24px; text-align: center; }

    .pay-spinner { width: 34px; height: 34px; border: 3px solid #E5E7EB; border-top-color: var(--blue); border-radius: 50%; animation: pay-spin .75s linear infinite; margin: 0 auto 14px; }
    @keyframes pay-spin { to { transform: rotate(360deg); } }

    .pay-icon-ring { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; background: #fff; }
    .pay-hero-title { margin: 0 0 6px; font-size: clamp(1.1rem, 4.5vw, 1.4rem); font-weight: 800; line-height: 1.3; }
    .pay-hero-sub { margin: 0; font-size: 13.5px; color: var(--text-2); line-height: 1.6; }

    .pay-code-box { background: #F9FAFB; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 18px 0 10px; cursor: pointer; text-align: left; }
    .pay-code-input { width: 100%; border: none; background: transparent; color: #374151; font-size: 13px; line-height: 1.55; outline: none; cursor: pointer; word-break: break-all; font-family: 'Inter', monospace; }
    .pay-qr-img { width: 200px; height: 200px; margin: 4px auto 10px; display: block; border: 1px solid var(--border); border-radius: 10px; }

    .pay-copy-btn { background: var(--blue); color: #fff; border: none; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 6px; transition: background .15s, opacity .15s; }
    .pay-copy-btn:hover:not(:disabled) { background: var(--blue-dark); }
    .pay-copy-btn:disabled { opacity: .5; cursor: not-allowed; }
    .pay-copy-feedback { text-align: center; font-size: 13px; color: var(--green); font-weight: 600; min-height: 20px; margin-top: 8px; }

    .pay-status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 6px; background: #FEF3C7; border: 1px solid #FDE68A; color: #92400E; }
    .pay-status-badge.approved { background: #F0FDF4; border-color: #BBF7D0; color: #15803D; }
    .pay-status-badge.rejected, .pay-status-badge.cancelled { background: #FEF2F2; border-color: #FECACA; color: #DC2626; }

    .pay-ticket-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--rose); color: #fff; border: none; border-radius: 10px; padding: 13px 24px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; margin-top: 14px; }
    .pay-ticket-btn:hover { background: var(--rose-dark); }

    .pay-result-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--rose); color: #fff; border: none; border-radius: 10px; padding: 13px 24px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; margin-top: 8px; }
    .pay-result-btn:hover { background: var(--rose-dark); }
    .pay-orders-link { display: block; text-align: center; color: var(--rose); font-size: 14px; font-weight: 600; padding: 10px; }
    .pay-orders-link:hover { text-decoration: underline; }

    .pay-info-box { display: flex; align-items: flex-start; gap: 10px; background: #F0F9FF; border-left: 3.5px solid #38BDF8; border-radius: 0 8px 8px 0; padding: 12px 14px; margin-top: 16px; text-align: left; }
    .pay-info-box p { margin: 0; font-size: 13px; color: #374151; line-height: 1.55; }
  </style>
  <script src="/js/meta-pixel.js"></script>
</head>
<body>

<header class="pay-header">
  <a href="index.html" class="pay-logo">DAMA'S <span>SECRETA</span></a>
  <span class="pay-hdr-right">Mercado Pago 🔒</span>
</header>

<div class="pay-shell">
  <div class="pay-card" id="mp-result-card">
    <div class="pay-spinner" id="mp-spinner"></div>
    <h1 class="pay-hero-title" id="mp-title">Confirmando pagamento...</h1>
    <p class="pay-hero-sub" id="mp-sub">Aguarde só um instante.</p>

    <div id="mp-status-badge" class="pay-status-badge" style="display:none;"></div>

    <!-- PIX -->
    <div id="mp-pix-section" style="display:none;">
      <img id="mp-qr-img" class="pay-qr-img" src="" alt="QR Code Pix" style="display:none;"/>
      <div class="pay-code-box" onclick="copyPixCode()">
        <input id="mp-pix-code" class="pay-code-input" type="text" readonly placeholder="Código Pix indisponível"/>
      </div>
      <button class="pay-copy-btn" id="mp-copy-btn" onclick="copyPixCode()">Copiar código Pix</button>
      <div class="pay-copy-feedback" id="mp-copy-feedback" aria-live="polite"></div>
    </div>

    <!-- Boleto / ticket -->
    <div id="mp-ticket-section" style="display:none;">
      <a id="mp-ticket-link" class="pay-ticket-btn" href="#" target="_blank" rel="noopener">Abrir boleto</a>
    </div>

    <div class="pay-info-box" id="mp-info-box" style="display:none;">
      <p id="mp-info-text"></p>
    </div>
  </div>

  <a href="meus-pedidos.html" class="pay-orders-link">Ir para Minhas compras</a>
</div>

<script src="/js/site-config.js"></script>
<script src="/js/cookie-consent.js"></script>
<script>
  function formatBRL(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

  const STATUS_LABELS = {
    approved:    { label: 'Pagamento aprovado', cls: 'approved' },
    pending:     { label: 'Aguardando pagamento', cls: 'pending' },
    in_process:  { label: 'Pagamento em análise', cls: 'pending' },
    rejected:    { label: 'Pagamento recusado', cls: 'rejected' },
    cancelled:   { label: 'Pagamento cancelado', cls: 'cancelled' },
    refunded:    { label: 'Pagamento estornado', cls: 'cancelled' },
    charged_back:{ label: 'Pagamento contestado (chargeback)', cls: 'cancelled' },
  };

  let session = null;
  try { session = JSON.parse(localStorage.getItem('user-session') || 'null'); } catch (e) {}

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId');
  let paymentId = params.get('paymentId');

  let stored = null;
  try { stored = JSON.parse(sessionStorage.getItem('mp-payment-result') || 'null'); } catch (e) {}
  if (stored && stored.orderId === orderId) {
    paymentId = stored.paymentId || paymentId;
  }

  const spinnerEl = document.getElementById('mp-spinner');
  const titleEl   = document.getElementById('mp-title');
  const subEl     = document.getElementById('mp-sub');
  const badgeEl   = document.getElementById('mp-status-badge');
  const pixSec    = document.getElementById('mp-pix-section');
  const ticketSec = document.getElementById('mp-ticket-section');
  const infoBox   = document.getElementById('mp-info-box');
  const infoText  = document.getElementById('mp-info-text');

  function applyPixData(pix) {
    if (!pix) return;
    pixSec.style.display = 'block';
    const codeInput = document.getElementById('mp-pix-code');
    const qrImg = document.getElementById('mp-qr-img');
    const copyBtn = document.getElementById('mp-copy-btn');
    if (pix.qrCode) { codeInput.value = pix.qrCode; copyBtn.disabled = false; }
    if (pix.qrCodeBase64) { qrImg.src = 'data:image/png;base64,' + pix.qrCodeBase64; qrImg.style.display = 'block'; }
  }

  function applyTicketData(ticketUrl) {
    if (!ticketUrl) return;
    ticketSec.style.display = 'block';
    document.getElementById('mp-ticket-link').href = ticketUrl;
  }

  function render(status, statusDetail, extra) {
    const meta = STATUS_LABELS[status] || { label: status || 'Status desconhecido', cls: 'pending' };
    spinnerEl.style.display = (status === 'pending' || status === 'in_process' || !status) ? 'block' : 'none';

    badgeEl.style.display = 'inline-flex';
    badgeEl.className = 'pay-status-badge ' + meta.cls;
    badgeEl.textContent = meta.label;

    if (status === 'approved') {
      titleEl.textContent = 'Pagamento confirmado!';
      subEl.textContent = 'Obrigado pela sua compra. Seu pedido foi confirmado e será enviado em breve.';
      pixSec.style.display = 'none';
    } else if (status === 'pending' || status === 'in_process') {
      const isPix = extra && extra.paymentMethodId === 'pix';
      const isTicket = extra && extra.ticketUrl;
      titleEl.textContent = isPix ? 'Pague com Pix para concluir' : (isTicket ? 'Pedido registrado' : 'Pagamento em processamento');
      subEl.textContent = isPix
        ? 'Escaneie o QR Code ou copie o código abaixo no app do seu banco.'
        : (isTicket ? 'Abra o boleto abaixo e realize o pagamento até o vencimento.' : 'Assim que recebermos a confirmação, seu pedido será liberado automaticamente.');
    } else if (status === 'rejected' || status === 'cancelled') {
      titleEl.textContent = 'Pagamento não aprovado';
      subEl.textContent = 'Você pode tentar novamente com outro método de pagamento.';
      infoBox.style.display = 'flex';
      infoText.textContent = 'Nenhum valor foi cobrado. Volte ao checkout para tentar novamente.';
    } else if (status === 'refunded' || status === 'charged_back') {
      titleEl.textContent = 'Pagamento estornado';
      subEl.textContent = 'Este pagamento foi estornado. Entre em contato caso não reconheça esta ação.';
    } else {
      titleEl.textContent = 'Consultando pagamento...';
      subEl.textContent = '';
    }
  }

  let pollTimer = null;
  const TERMINAL = ['approved', 'rejected', 'cancelled', 'refunded', 'charged_back'];

  async function pollStatus() {
    if (!paymentId || !session || !session.token) return;
    try {
      const r = await fetch('/api/payments/mercado-pago/' + encodeURIComponent(paymentId) + '/status', {
        headers: { 'x-auth-token': session.token },
      });
      const data = await r.json();
      if (!data.success) return;
      render(data.status, data.statusDetail, stored || {});
      if (TERMINAL.includes(data.status)) {
        clearInterval(pollTimer);
      }
    } catch (e) { /* silencioso — mantém último estado exibido */ }
  }

  function init() {
    if (stored) {
      render(stored.status, stored.statusDetail, stored);
      if (stored.pix) applyPixData(stored.pix);
      if (stored.ticketUrl) applyTicketData(stored.ticketUrl);
    } else {
      render(null, null, {});
    }

    if (paymentId) {
      pollStatus();
      pollTimer = setInterval(pollStatus, 6000);
    } else {
      spinnerEl.style.display = 'none';
    }
  }

  window.copyPixCode = function () {
    const input = document.getElementById('mp-pix-code');
    const fb = document.getElementById('mp-copy-feedback');
    if (!input || !input.value) return;
    const showFeedback = () => {
      if (fb) { fb.textContent = '✓ Código copiado com sucesso!'; setTimeout(() => { fb.textContent = ''; }, 2500); }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(input.value).then(showFeedback).catch(() => {
        try { input.select(); document.execCommand('copy'); } catch (e) {}
        showFeedback();
      });
    } else {
      try { input.select(); document.execCommand('copy'); } catch (e) {}
      showFeedback();
    }
  };

  init();
</script>
</body>
</html>
