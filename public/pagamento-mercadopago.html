<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Mercado Pago — DAMA'S SECRETA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <style>
    :root {
      --blue: #009EE3; --blue-dark: #0080BC;
      --rose: #E8518A; --rose-dark: #C93D72;
      --bg: #FFF8FA; --card: #fff;
      --text: #1A0A12; --text-2: #6B3A56; --muted: #B08EA0; --border: #F0D4E5;
      --radius: 18px; --shadow: 0 1px 4px rgba(180,50,100,.07), 0 6px 20px rgba(180,50,100,.07);
    }
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }

    .pay-header { background: var(--blue); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .pay-logo { font-family: Georgia, serif; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: .04em; }
    .pay-logo span { color: #D6F0FF; }
    .pay-hdr-right { font-size: 12px; color: rgba(255,255,255,.85); font-weight: 500; }

    .pay-shell { width: min(480px, 100%); margin: 0 auto; padding: 20px 14px 56px; display: flex; flex-direction: column; gap: 14px; }
    .pay-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; min-height: 220px; }

    .pay-loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; gap: 14px; color: var(--text-2); font-size: 14px; text-align: center; }
    .pay-spinner { width: 34px; height: 34px; border: 3px solid #E5E7EB; border-top-color: var(--blue); border-radius: 50%; animation: pay-spin .75s linear infinite; }
    @keyframes pay-spin { to { transform: rotate(360deg); } }

    .pay-error-box { padding: 28px 24px; text-align: center; }
    .pay-error-box h2 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 800; color: #DC2626; }
    .pay-error-box p { margin: 0 0 18px; font-size: 13.5px; color: var(--text-2); line-height: 1.6; }
    .pay-result-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--rose); color: #fff; border: none; border-radius: 10px; padding: 13px 24px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .pay-result-btn:hover { background: var(--rose-dark); }
    .pay-orders-link { display: block; text-align: center; color: var(--rose); font-size: 14px; font-weight: 600; padding: 10px; }
    .pay-orders-link:hover { text-decoration: underline; }
  </style>
  <script src="/js/meta-pixel.js"></script>
</head>
<body>

<header class="pay-header">
  <a href="index.html" class="pay-logo">DAMA'S <span>SECRETA</span></a>
  <span class="pay-hdr-right">Mercado Pago 🔒</span>
</header>

<div class="pay-shell">
  <div class="pay-card">
    <div id="mp-loading" class="pay-loading-wrap">
      <div class="pay-spinner"></div>
      <p id="mp-loading-text">Carregando status do pagamento...</p>
    </div>
    <div id="mp-error-box" class="pay-error-box" style="display:none;">
      <h2>Não foi possível exibir este pagamento</h2>
      <p id="mp-error-text">Verifique se você está logado com a conta usada na compra.</p>
      <a href="meus-pedidos.html" class="pay-result-btn">Ir para Minhas compras</a>
    </div>
    <!-- Status Screen Brick é montado aqui pelo SDK oficial do Mercado Pago -->
    <div id="mp-status-brick-container"></div>
  </div>

  <a href="meus-pedidos.html" class="pay-orders-link">Ir para Minhas compras</a>
</div>

<script src="/js/site-config.js"></script>
<script src="/js/cookie-consent.js"></script>
<script src="https://sdk.mercadopago.com/js/v2"></script>
<script>
  let session = null;
  try { session = JSON.parse(localStorage.getItem('user-session') || 'null'); } catch (e) {}

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('orderId');
  let paymentId = params.get('paymentId');

  let stored = null;
  try { stored = JSON.parse(sessionStorage.getItem('mp-payment-result') || 'null'); } catch (e) {}
  if (stored && stored.orderId === orderId) {
    paymentId = stored.paymentId || paymentId;
  }

  const loadingEl = document.getElementById('mp-loading');
  const errorBox  = document.getElementById('mp-error-box');
  const errorText = document.getElementById('mp-error-text');

  function getCheckoutSummary() {
    try {
      return JSON.parse(localStorage.getItem('checkout-summary') || 'null');
    } catch (e) {
      return null;
    }
  }

  function trackApprovedPurchase(statusData) {
    const summary = getCheckoutSummary();
    const ids = summary && Array.isArray(summary.produto)
      ? summary.produto.map((p) => String(p.id)).filter(Boolean)
      : [];
    const numItems = summary ? summary.quantidade : 1;
    const value = summary ? Number(summary.total_final) || 0 : 0;
    const transactionId = String((statusData && statusData.orderId) || (statusData && statusData.paymentId) || paymentId || '');

    if (window.MetaPixel) {
      window.MetaPixel.purchase({
        orderId: transactionId,
        value,
        ids,
        numItems,
      });
    }

    if (window.GoogleAds) {
      window.GoogleAds.purchaseConversion({
        transactionId,
        value,
        currency: 'BRL',
      });
    }
  }

  async function fetchPaymentStatus(showErrorOnFailure) {
    const r = await fetch('/api/payments/mercado-pago/' + encodeURIComponent(paymentId) + '/status', {
      headers: { 'x-auth-token': session.token },
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      if (showErrorOnFailure) {
        showFatalError(data.error || 'Não foi possível carregar este pagamento.');
      }
      return null;
    }
    return r.json();
  }

  function startTrackingStatusPolling() {
    const intervalId = window.setInterval(async () => {
      try {
        const data = await fetchPaymentStatus(false);
        if (!data) return;
        if (data.status === 'approved') {
          window.clearInterval(intervalId);
          trackApprovedPurchase(data);
          return;
        }
        if (data.status === 'rejected' || data.status === 'cancelled' || data.status === 'refunded' || data.status === 'charged_back') {
          window.clearInterval(intervalId);
        }
      } catch (e) {}
    }, 3000);
  }

  function showFatalError(msg) {
    loadingEl.style.display = 'none';
    errorBox.style.display = 'block';
    if (msg) errorText.textContent = msg;
  }

  async function init() {
    if (!paymentId) {
      showFatalError('Nenhum pagamento informado. Volte ao checkout e tente novamente.');
      return;
    }
    if (!session || !session.token) {
      showFatalError('Faça login com a conta usada na compra para ver o status deste pagamento.');
      return;
    }

    // Confirma que o pagamento pertence a este usuário antes de exibir qualquer coisa —
    // o Status Screen Brick por si só não faz esse controle de autorização.
    let statusData;
    try {
      statusData = await fetchPaymentStatus(true);
      if (!statusData) {
        return;
      }
    } catch (e) {
      showFatalError('Falha de conexão. Tente novamente em instantes.');
      return;
    }

    if (statusData.status === 'approved') {
      trackApprovedPurchase(statusData);
    } else {
      startTrackingStatusPolling();
    }

    let cfg;
    try {
      cfg = await fetch('/api/payments/mercado-pago/config').then((r) => r.json());
    } catch (e) {
      cfg = { configured: false };
    }
    if (!cfg || !cfg.configured || !cfg.publicKey || !window.MercadoPago) {
      showFatalError('Pagamento via Mercado Pago está temporariamente indisponível.');
      return;
    }

    const mp = new window.MercadoPago(cfg.publicKey, { locale: 'pt-BR' });

    const settings = {
      initialization: {
        paymentId: paymentId,
        // Presente apenas quando o pagamento exige autenticação 3DS (desafio do banco) —
        // o Status Screen Brick usa isso para renderizar/redirecionar para o Challenge.
        ...(stored && stored.threeDsInfo && stored.threeDsInfo.externalResourceURL ? {
          additionalInfo: {
            externalResourceURL: stored.threeDsInfo.externalResourceURL,
            creq: stored.threeDsInfo.creq || undefined,
          },
        } : {}),
      },
      callbacks: {
        onReady: () => { loadingEl.style.display = 'none'; },
        onError: (error) => {
          console.error('[MercadoPago StatusScreen] onError', error);
          showFatalError('Não foi possível carregar o status deste pagamento.');
        },
      },
    };

    try {
      window.statusScreenBrickController = await mp.bricks().create('statusScreen', 'mp-status-brick-container', settings);
    } catch (e) {
      console.error('[MercadoPago StatusScreen] falha ao montar', e);
      showFatalError('Não foi possível carregar o status deste pagamento.');
    }
  }

  init();
</script>
</body>
</html>
