<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Redefinir senha — DAMA'S SECRETA</title>
<meta name="description" content="Defina uma nova senha para sua conta DAMA'S SECRETA."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"></noscript>
<script src="/js/meta-pixel.js"></script>
<style>
:root {
  --rose:      #E8518A;
  --rose-dark: #C93D72;
  --rose-light:#FFF0F6;
  --green:     #16A34A;
  --red:       #DC2626;
  --black:     #0A0A0A;
  --bg:        #FFF8FA;
  --card:      #FFFFFF;
  --text:      #1A0A12;
  --text-2:    #6B3A56;
  --muted:     #B08EA0;
  --border:    #F0D4E5;
  --shadow:    0 4px 24px rgba(180,50,100,.1);
  --radius:    14px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; max-width:100%; overflow-x:hidden; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: var(--black);
  padding: 12px 20px;
  position: sticky; top: 0; z-index: 99;
  box-shadow: 0 2px 16px rgba(0,0,0,.4);
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 480px; margin: 0 auto;
}
.logo { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700; text-decoration: none; color: #fff; letter-spacing: .05em; }
.logo span { color: var(--rose); }
.back-link {
  font-size: 13px; color: rgba(255,255,255,.8);
  text-decoration: none; font-weight: 600;
  display: flex; align-items: center; gap: 4px;
}
.back-link:hover { color: var(--rose); }
main {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px 140px;
}
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 36px 32px;
  width: 100%; max-width: 420px;
}
.card-brand {
  text-align: center; margin-bottom: 24px;
}
.card-brand-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--rose), var(--rose-dark));
  color: #fff;
  display: inline-grid; place-items: center;
  font-size: 24px;
  margin-bottom: 12px;
  box-shadow: 0 6px 20px rgba(201,61,114,.3);
}
.card-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; text-align: center; }
.card-subtitle { color: var(--text-2); font-size: 14px; margin-bottom: 28px; text-align: center; }
.form-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 13px; font-weight: 600;
  margin-bottom: 6px; color: var(--text);
}
input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  font-size: 15px; font-family: inherit;
  color: var(--text);
  background: #FAFAFA;
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}
input:focus {
  border-color: var(--rose);
  box-shadow: 0 0 0 3px rgba(232,81,138,.1);
  background: #fff;
}
.btn-primary {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--rose), var(--rose-dark));
  color: #fff;
  border: none; border-radius: 9px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  cursor: pointer;
  transition: filter .2s, transform .15s, box-shadow .2s;
  margin-top: 8px;
}
.btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(201,61,114,.35); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  text-decoration: none;
  text-align: center;
  display: inline-block;
  margin-top: 10px;
}
.btn-secondary:hover { border-color: var(--rose); color: var(--rose-dark); }
.error-msg {
  background: #FEF2F2; border: 1px solid #FECACA;
  color: #DC2626; padding: 11px 14px;
  border-radius: 8px; font-size: 13px;
  margin-bottom: 16px; display: none;
}
.success-msg {
  background: #ECFDF3; border: 1px solid #A7F3D0;
  color: #166534; padding: 11px 14px;
  border-radius: 8px; font-size: 13px;
  margin-bottom: 16px; display: none;
}
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 480px) {
  .card { padding: 28px 20px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">DAMA'S <span>SECRETA</span></a>
    <a class="back-link" href="login.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar ao login
    </a>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-brand">
      <div class="card-brand-icon">🔒</div>
    </div>

    <h1 class="card-title">Redefinir senha</h1>
    <p class="card-subtitle">Digite sua nova senha para concluir a recuperação</p>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label for="nova-senha">Nova senha</label>
        <input type="password" id="nova-senha" name="novaSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required/>
      </div>

      <div class="form-group">
        <label for="confirmar-senha">Confirmar nova senha</label>
        <input type="password" id="confirmar-senha" name="confirmarSenha" placeholder="Repita a nova senha" autocomplete="new-password" required/>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Alterar senha</button>
    </form>

    <a href="login.html" class="btn-secondary" id="back-login-btn" style="display:none;">Voltar para o login</a>
  </div>
</main>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const token = (params.get('token') || '').trim();

  const form = document.getElementById('reset-form');
  const novaSenhaInput = document.getElementById('nova-senha');
  const confirmarSenhaInput = document.getElementById('confirmar-senha');
  const submitBtn = document.getElementById('submit-btn');
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');
  const backLoginBtn = document.getElementById('back-login-btn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  function hideError() {
    errorMsg.style.display = 'none';
  }

  function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.style.display = 'block';
  }

  function hideSuccess() {
    successMsg.style.display = 'none';
  }

  function setLoading(loading) {
    submitBtn.disabled = loading;
    submitBtn.innerHTML = loading ? '<span class="spinner"></span>Alterando...' : 'Alterar senha';
  }

  if (!token) {
    showError('Este link de recuperação é inválido ou expirou. Solicite um novo link.');
    submitBtn.disabled = true;
    backLoginBtn.style.display = 'inline-block';
    return;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideError();
    hideSuccess();

    const novaSenha = novaSenhaInput.value;
    const confirmarSenha = confirmarSenhaInput.value;

    if (!novaSenha || !confirmarSenha) {
      showError('Preencha todos os campos.');
      return;
    }
    if (novaSenha.length < 6) {
      showError('A nova senha deve ter pelo menos 6 caracteres.');
      return;
    }
    if (novaSenha !== confirmarSenha) {
      showError('As senhas não coincidem.');
      return;
    }

    setLoading(true);
    try {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, novaSenha, confirmarSenha })
      });
      const data = await r.json().catch(() => ({}));

      if (!r.ok || !data.success) {
        showError(data.error || 'Não foi possível redefinir sua senha agora.');
        setLoading(false);
        return;
      }

      showSuccess(data.message || 'Senha alterada com sucesso.');
      form.reset();
      form.style.display = 'none';
      backLoginBtn.style.display = 'inline-block';
    } catch (err) {
      showError('Erro de conexão. Tente novamente.');
      setLoading(false);
      return;
    }

    setLoading(false);
  });
})();
</script>
<script src="/js/site-config.js"></script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
