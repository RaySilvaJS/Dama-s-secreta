<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meus Pedidos — DAMA'S SECRETA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"></noscript>
<style>
:root {
  --bg: #FFF8FA;
  --card: #ffffff;
  --text: #1A0A12;
  --muted: #B08EA0;
  --purple: #C93D72;
  --rose: #E8518A;
  --shadow: 0 10px 30px rgba(180,50,100,.08);
  --radius: 22px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; max-width:100%; overflow-x:hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 16px 20px;
  background: #0A0A0A;
  border-bottom: 1px solid #2A0A1A;
  position: sticky;
  top: 0;
  z-index: 99;
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 800px;
  margin: 0 auto;
}
.logo { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700; text-decoration: none; color: #fff; letter-spacing: .03em; }
.logo span { color: var(--rose); }
.nav-links { display: flex; gap: 12px; }
.back-link {
  font-size: 13px;
  color: rgba(255,255,255,.75);
  text-decoration: none;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}
.back-link:hover { text-decoration: underline; }
main {
  flex: 1;
  padding: 40px 20px 60px;
  max-width: 800px;
  margin: 0 auto;
  width: 100%;
}
.page-header {
  margin-bottom: 28px;
}
.page-title { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
.page-subtitle { color: var(--muted); font-size: 14px; }
.order-card {
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 22px 26px;
  margin-bottom: 16px;
  border: 1px solid rgba(0,0,0,.04);
  transition: box-shadow .2s, transform .2s;
}
.order-card:hover { box-shadow: 0 16px 40px rgba(0,0,0,.1); transform: translateY(-2px); }
.order-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.order-id {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 4px;
}
.order-product {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.3;
}
.order-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}
.status-pending { background: rgba(237,137,54,.12); color: #c05621; }
.status-awaiting { background: rgba(201,61,114,.1); color: var(--purple); }
.status-paid { background: rgba(72,187,120,.12); color: #276749; }
.status-shipped { background: rgba(37,99,235,.12); color: #1D4ED8; }
.status-cancelled { background: rgba(220,38,38,.1); color: #B91C1C; }
.order-meta {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.order-meta-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.order-meta-item .label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.order-meta-item .val {
  font-size: 15px;
  font-weight: 600;
}
.order-meta-item .val.price { color: var(--purple); font-size: 17px; font-weight: 800; }
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.dot-pending { background: #c05621; }
.dot-awaiting { background: var(--purple); }
.dot-paid { background: #48bb78; }
.dot-shipped { background: #2563EB; }
.dot-cancelled { background: #DC2626; }

/* ── Itens do pedido (thumb) ───────────────────────────────────────────── */
.order-items-preview { display: flex; align-items: center; gap: 12px; }
.order-thumb {
  width: 56px; height: 56px; border-radius: 12px; object-fit: cover;
  border: 1px solid rgba(0,0,0,.06); background: #FAFAFA; flex-shrink: 0;
}
.order-items-extra { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ── Toggle "Ver detalhes" ─────────────────────────────────────────────── */
.order-toggle-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 16px; padding: 9px 16px; border-radius: 10px;
  border: 1.5px solid rgba(201,61,114,.25); background: transparent;
  color: var(--purple); font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: background .2s;
}
.order-toggle-btn:hover { background: rgba(201,61,114,.06); }
.order-toggle-btn svg { transition: transform .2s; }
.order-toggle-btn.open svg { transform: rotate(180deg); }

/* ── Painel de detalhes (itens, timeline, endereco) ───────────────────── */
.order-detail { display: none; margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(0,0,0,.06); }
.order-detail.open { display: block; }
.detail-block { margin-bottom: 22px; }
.detail-block:last-child { margin-bottom: 0; }
.detail-block-title {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;
}
.detail-item-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.detail-item-row + .detail-item-row { border-top: 1px solid rgba(0,0,0,.04); }
.detail-item-name { font-size: 14px; font-weight: 600; flex: 1; }
.detail-item-qty { font-size: 12px; color: var(--muted); }
.detail-item-price { font-size: 14px; font-weight: 700; color: var(--text); flex-shrink: 0; }

/* Timeline vertical */
.timeline { display: flex; flex-direction: column; }
.timeline-step { display: flex; gap: 14px; position: relative; padding-bottom: 22px; }
.timeline-step:last-child { padding-bottom: 0; }
.timeline-marker { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.timeline-dot {
  width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: #E5E7EB; color: #9CA3AF; flex-shrink: 0; z-index: 1;
}
.timeline-dot.done { background: #48bb78; color: #fff; }
.timeline-dot.danger { background: #DC2626; color: #fff; }
.timeline-dot.warning { background: #D97706; color: #fff; }
.timeline-dot.current { background: var(--purple); color: #fff; }
.timeline-line { width: 2px; flex: 1; background: #E5E7EB; margin-top: 2px; }
.timeline-line.done { background: #48bb78; }
.timeline-step:last-child .timeline-line { display: none; }
.timeline-content { padding-top: 1px; }
.timeline-label { font-size: 14px; font-weight: 700; color: var(--text); }
.timeline-label.muted { color: var(--muted); font-weight: 600; }
.timeline-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
.timeline-location { font-size: 12px; color: var(--purple); margin-top: 2px; font-weight: 600; }

/* Rastreio */
.tracking-box {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: rgba(37,99,235,.06); border: 1px solid rgba(37,99,235,.15);
  border-radius: 12px; padding: 12px 16px;
}
.tracking-code { font-family: monospace; font-size: 14px; font-weight: 700; color: #1D4ED8; }
.tracking-code.muted { color: var(--muted); font-family: inherit; font-weight: 600; }
.tracking-box.pending { background: rgba(0,0,0,.03); border-color: rgba(0,0,0,.07); }
.copy-btn {
  border: none; background: #1D4ED8; color: #fff; font-size: 12px; font-weight: 700;
  padding: 7px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; flex-shrink: 0;
}
.tracking-wait-msg { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.external-track-link { display: inline-block; font-size: 12.5px; color: #1D4ED8; font-weight: 700; text-decoration: none; margin-top: 8px; }
.external-track-link:hover { text-decoration: underline; }

/* Endereço */
.address-line { font-size: 14px; line-height: 1.5; }

/* Comprar novamente */
.buy-again-btn {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 4px; padding: 11px 20px; border-radius: 10px;
  border: none; background: var(--text); color: #fff;
  font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.empty-state {
  text-align: center;
  padding: 80px 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.empty-icon {
  width: 72px;
  height: 72px;
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(201,61,114,.1), rgba(201,61,114,.05));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--purple);
  margin: 0 auto 20px;
}
.empty-state h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.empty-state p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  background: linear-gradient(135deg, #E8518A, #C93D72);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
  transition: transform .2s, box-shadow .2s;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,61,114,.35); }
.loading-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.orders-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  color: var(--muted);
  font-size: 14px;
}
.orders-count {
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--rose), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
@media (max-width: 600px) {
  .order-card { padding: 18px 16px; }
  .order-header { flex-direction: column; gap: 10px; }
  .order-meta { gap: 16px; }
}
</style>
<script src="/js/meta-pixel.js"></script>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">DAMA'S <span>SECRETA</span></a>
    <div class="nav-links">
      <a class="back-link" href="minha-conta.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Minha Conta
      </a>
      <a class="back-link" href="index.html" style="color:var(--muted)">
        Loja
      </a>
    </div>
  </div>
</header>

<main>
  <div class="page-header">
    <h1 class="page-title">Meus Pedidos</h1>
    <p class="page-subtitle">Histórico de todas as suas compras</p>
  </div>

  <div id="loading-state" class="loading-state">Carregando seus pedidos...</div>
  <div id="orders-content" style="display:none;"></div>
</main>

<script>
(function () {
  const AUTH_KEY = 'user-session';

  function getSession() {
    try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch(e) { return null; }
  }

  const session = getSession();
  if (!session || !session.token) {
    window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname);
    return;
  }

  function formatBRL(v) {
    return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function formatDate(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch(e) { return iso; }
  }

  function shortId(id) {
    if (!id) return '—';
    return '#' + id.replace(/-/g, '').slice(0, 8).toUpperCase();
  }

  // Status combinado (pagamento + envio) pro selo do card — a mesma lógica
  // que o Mercado Livre usa: mostra sempre o estágio mais avançado do pedido.
  function combinedStatusInfo(order) {
    if (order.status === 'cancelled') return { label: 'Cancelado', cls: 'status-cancelled', dotCls: 'dot-cancelled' };
    if (order.status === 'refused')   return { label: 'Pagamento recusado', cls: 'status-cancelled', dotCls: 'dot-cancelled' };
    if (order.fulfillmentStatus === 'delivered') return { label: 'Entregue', cls: 'status-paid', dotCls: 'dot-paid' };
    if (order.fulfillmentStatus === 'shipped')   return { label: 'A caminho', cls: 'status-shipped', dotCls: 'dot-shipped' };
    if (order.status === 'paid') return { label: 'Pago — preparando envio', cls: 'status-paid', dotCls: 'dot-paid' };
    if (order.status === 'awaiting_validation') return { label: 'Comprovante em análise', cls: 'status-awaiting', dotCls: 'dot-awaiting' };
    return { label: 'Aguardando pagamento', cls: 'status-pending', dotCls: 'dot-pending' };
  }

  // Rótulos amigáveis do rastreamento granular (server/admin.js tem o mesmo mapa —
  // duplicado de propósito, cada evento já vem com "descricao" pronta do servidor,
  // isso aqui é só um fallback caso descricao venha vazia).
  var TRACKING_LABELS = {
    PEDIDO_REALIZADO: 'Pedido realizado', PAGAMENTO_PENDENTE: 'Pagamento pendente', PAGAMENTO_APROVADO: 'Pagamento aprovado',
    PAGAMENTO_RECUSADO: 'Pagamento recusado', PREPARANDO_ENVIO: 'Preparando pedido', AGUARDANDO_POSTAGEM: 'Aguardando envio',
    ENVIADO: 'Pedido enviado', OBJETO_POSTADO: 'Objeto postado', RECEBIDO_TRANSPORTADORA: 'Recebido pela transportadora',
    EM_TRANSITO: 'Em trânsito', CHEGOU_UNIDADE: 'Chegou à unidade de distribuição', SAIU_PARA_ENTREGA: 'Saiu para entrega',
    ENTREGUE: 'Entregue', TENTATIVA_ENTREGA: 'Tentativa de entrega', ENDERECO_NAO_LOCALIZADO: 'Endereço não localizado',
    DEVOLVIDO: 'Objeto devolvido', CANCELADO: 'Pedido cancelado',
  };
  var HAPPY_PATH = ['PEDIDO_REALIZADO', 'PAGAMENTO_APROVADO', 'PREPARANDO_ENVIO', 'AGUARDANDO_POSTAGEM', 'ENVIADO', 'EM_TRANSITO', 'SAIU_PARA_ENTREGA', 'ENTREGUE'];
  var TERMINAL_BAD = ['CANCELADO', 'DEVOLVIDO', 'PAGAMENTO_RECUSADO'];
  var PROBLEM_STATUSES = ['TENTATIVA_ENTREGA', 'ENDERECO_NAO_LOCALIZADO'];

  // Linha do tempo completa, a partir do histórico real de eventos (order.tracking.eventos).
  // Mostra tudo que já aconteceu (com data/local) e completa com os próximos passos do
  // fluxo padrão ainda não alcançados, como "Aguardando atualização" — nunca inventa datas.
  function getTimelineSteps(order) {
    if (!order.tracking || !order.tracking.eventos || !order.tracking.eventos.length) {
      return getLegacyTimelineSteps(order); // pedidos antigos, sem o campo tracking ainda
    }

    const eventos = order.tracking.eventos;
    const lastEvent = eventos[eventos.length - 1];

    const steps = eventos.map(function (ev, i) {
      const isLast = i === eventos.length - 1;
      const isTerminalBad = TERMINAL_BAD.indexOf(ev.status) !== -1;
      const isProblem = PROBLEM_STATUSES.indexOf(ev.status) !== -1;
      return {
        label: ev.descricao || TRACKING_LABELS[ev.status] || ev.status,
        date: ev.data,
        localizacao: ev.localizacao,
        state: isTerminalBad ? 'danger' : isProblem ? 'warning' : (isLast ? 'current' : 'done'),
      };
    });

    const stopped = TERMINAL_BAD.indexOf(lastEvent.status) !== -1;
    if (!stopped) {
      const happyIdx = HAPPY_PATH.indexOf(lastEvent.status);
      if (happyIdx !== -1) {
        const nextStatuses = HAPPY_PATH.slice(happyIdx + 1);
        if (nextStatuses.length) steps[steps.length - 1].state = 'current';
        nextStatuses.forEach(function (status) {
          steps.push({ label: TRACKING_LABELS[status], date: null, localizacao: null, state: 'pending' });
        });
      } else {
        // Status "problema" fora do caminho padrão (ex: tentativa de entrega) — o pedido
        // ainda pode chegar a "Entregue", então deixa esse próximo passo visível.
        steps.push({ label: TRACKING_LABELS.ENTREGUE, date: null, localizacao: null, state: 'pending' });
      }
    }

    return steps;
  }

  // Fluxo simples de 4 etapas — usado só pra pedidos antigos, feitos antes do
  // rastreamento detalhado existir (sem order.tracking.eventos).
  function getLegacyTimelineSteps(order) {
    const steps = [{ label: 'Pedido realizado', date: order.createdAt, state: 'done' }];

    if (order.status === 'cancelled') {
      steps.push({ label: 'Pedido cancelado', date: null, state: 'danger' });
      return steps;
    }
    if (order.status === 'refused') {
      steps.push({ label: 'Pagamento recusado' + (order.refuseReason ? ': ' + order.refuseReason : ''), date: null, state: 'danger' });
      return steps;
    }

    if (order.status === 'awaiting_validation') {
      steps.push({ label: 'Comprovante em análise', date: null, state: 'current' });
      steps.push({ label: 'Pagamento aprovado', date: null, state: 'pending' });
    } else {
      steps.push({
        label: 'Pagamento aprovado', date: order.paidAt,
        state: order.status === 'paid' ? 'done' : 'current'
      });
    }

    const shipped   = order.fulfillmentStatus === 'shipped' || order.fulfillmentStatus === 'delivered';
    const delivered = order.fulfillmentStatus === 'delivered';
    steps.push({
      label: 'Pedido enviado', date: order.shippedAt,
      state: delivered || shipped ? 'done' : 'pending'
    });
    steps.push({
      label: 'Pedido entregue', date: order.deliveredAt,
      state: delivered ? 'done' : 'pending'
    });

    return steps;
  }

  function renderTimeline(steps) {
    return '<div class="timeline">' + steps.map(function (s, i) {
      const dotCls = s.state === 'done' ? 'done' : s.state === 'danger' ? 'danger' : s.state === 'warning' ? 'warning' : s.state === 'current' ? 'current' : '';
      const lineCls = s.state === 'done' ? 'done' : '';
      const icon = s.state === 'done'
        ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
        : (s.state === 'danger' || s.state === 'warning')
        ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
        : (i + 1);
      return '<div class="timeline-step">' +
        '<div class="timeline-marker">' +
          '<div class="timeline-dot ' + dotCls + '">' + icon + '</div>' +
          '<div class="timeline-line ' + lineCls + '"></div>' +
        '</div>' +
        '<div class="timeline-content">' +
          '<div class="timeline-label' + (s.state === 'pending' ? ' muted' : '') + '">' + escapeHtml(s.label) + '</div>' +
          (s.date ? '<div class="timeline-date">' + formatDate(s.date) + '</div>' : (s.state === 'pending' ? '<div class="timeline-date">Aguardando atualização</div>' : '')) +
          (s.localizacao ? '<div class="timeline-location">' + escapeHtml(s.localizacao) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function renderOrderDetail(order) {
    const itemsHtml = order.items.map(function (it) {
      return '<div class="detail-item-row">' +
        '<img class="order-thumb" src="' + escapeHtml(it.image || '') + '" alt="" onerror="this.style.visibility=\'hidden\'"/>' +
        '<div style="flex:1;min-width:0">' +
          '<div class="detail-item-name">' + escapeHtml(it.name) + '</div>' +
          '<div class="detail-item-qty">Qtd: ' + it.quantity + '</div>' +
        '</div>' +
        '<div class="detail-item-price">' + formatBRL(it.lineTotal) + '</div>' +
      '</div>';
    }).join('');

    let trackingHtml = '';
    if (order.trackingCode) {
      const codeEsc = escapeHtml(order.trackingCode).replace(/'/g, "\\'").replace(/"/g, '&quot;');
      trackingHtml =
        '<div class="detail-block">' +
          '<div class="detail-block-title">Código de Rastreio</div>' +
          '<div class="tracking-box">' +
            '<span class="tracking-code">' + escapeHtml(order.trackingCode) + '</span>' +
            '<button class="copy-btn" onclick="copyTrackingCode(\'' + codeEsc + '\', this)">Copiar</button>' +
          '</div>' +
          '<a class="external-track-link" href="https://rastreamento.correios.com.br/app/index.php?objetos=' + encodeURIComponent(order.trackingCode) + '" target="_blank" rel="noopener noreferrer">Rastrear externamente ↗</a>' +
        '</div>';
    } else if (order.status === 'paid') {
      trackingHtml =
        '<div class="detail-block">' +
          '<div class="detail-block-title">Código de Rastreio</div>' +
          '<div class="tracking-box pending">' +
            '<span class="tracking-code muted">Ainda não disponível</span>' +
          '</div>' +
          '<p class="tracking-wait-msg">Seu pedido está sendo preparado para envio. Assim que for enviado, o código de rastreio será disponibilizado aqui.</p>' +
        '</div>';
    }

    const addressHtml = order.address ? (
      '<div class="detail-block">' +
        '<div class="detail-block-title">Endereço de Entrega</div>' +
        '<div class="address-line">' +
          escapeHtml(order.address.rua) + ', ' + escapeHtml(order.address.numero) +
          (order.address.complemento ? ' – ' + escapeHtml(order.address.complemento) : '') + '<br/>' +
          escapeHtml(order.address.bairro) + ', ' + escapeHtml(order.address.cidade) + '/' + escapeHtml(order.address.estado) +
          ' · CEP ' + escapeHtml(order.address.cep) +
        '</div>' +
      '</div>'
    ) : '';

    return '<div class="order-detail" id="detail-' + order.id + '">' +
      '<div class="detail-block">' +
        '<div class="detail-block-title">Itens do Pedido</div>' +
        itemsHtml +
      '</div>' +
      '<div class="detail-block">' +
        '<div class="detail-block-title">Acompanhamento</div>' +
        renderTimeline(getTimelineSteps(order)) +
      '</div>' +
      trackingHtml +
      addressHtml +
      '<button class="buy-again-btn" onclick="buyAgain(\'' + order.id + '\')">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' +
        'Comprar novamente' +
      '</button>' +
    '</div>';
  }

  function renderOrders(orders) {
    const container = document.getElementById('orders-content');
    container.style.display = 'block';
    document.getElementById('loading-state').style.display = 'none';

    if (!orders || orders.length === 0) {
      container.innerHTML = '<div class="empty-state">' +
        '<div class="empty-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>' +
        '<h3>Nenhum pedido encontrado</h3>' +
        '<p>Você ainda não realizou compras. Explore nossa loja!</p>' +
        '<a href="index.html" class="btn-primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Ver produtos</a>' +
        '</div>';
      return;
    }

    const sortedOrders = [...orders].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    _ordersById = {};
    sortedOrders.forEach(function (o) { _ordersById[o.id] = o; });

    let html = '<div class="orders-summary"><span class="orders-count">' + sortedOrders.length + '</span><span>pedido' + (sortedOrders.length !== 1 ? 's' : '') + ' encontrado' + (sortedOrders.length !== 1 ? 's' : '') + '</span></div>';

    sortedOrders.forEach(function (order) {
      const st = combinedStatusInfo(order);
      const firstItem = order.items[0] || {};
      const extraCount = order.items.length - 1;

      html += '<div class="order-card">' +
        '<div class="order-header">' +
          '<div class="order-items-preview">' +
            '<img class="order-thumb" src="' + escapeHtml(firstItem.image || '') + '" alt="" onerror="this.style.visibility=\'hidden\'"/>' +
            '<div>' +
              '<div class="order-id">Pedido ' + (order.shortId ? '#' + escapeHtml(order.shortId) : shortId(order.id)) + '</div>' +
              '<div class="order-product">' + escapeHtml(firstItem.name || 'Produto') + '</div>' +
              (extraCount > 0 ? '<div class="order-items-extra">+ ' + extraCount + ' outro' + (extraCount > 1 ? 's' : '') + ' item' + (extraCount > 1 ? 's' : '') + '</div>' : '') +
            '</div>' +
          '</div>' +
          '<span class="order-status ' + st.cls + '"><span class="dot ' + st.dotCls + '"></span>' + st.label + '</span>' +
        '</div>' +
        '<div class="order-meta">' +
          '<div class="order-meta-item"><span class="label">Valor Total</span><span class="val price">' + formatBRL(order.amount) + '</span></div>' +
          '<div class="order-meta-item"><span class="label">Data</span><span class="val">' + formatDate(order.createdAt) + '</span></div>' +
        '</div>' +
        '<button class="order-toggle-btn" id="toggle-' + order.id + '" onclick="toggleOrderDetail(\'' + order.id + '\')">' +
          'Ver detalhes do pedido' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
        renderOrderDetail(order) +
      '</div>';
    });

    container.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  let _ordersById = {};

  window.toggleOrderDetail = function (id) {
    const panel = document.getElementById('detail-' + id);
    const btn = document.getElementById('toggle-' + id);
    if (!panel) return;
    const isOpen = panel.classList.toggle('open');
    if (btn) btn.classList.toggle('open', isOpen);
  };

  window.copyTrackingCode = function (code, btn) {
    const done = function () {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = 'Copiado!';
      setTimeout(function () { btn.textContent = original; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done).catch(function () { prompt('Copie o código:', code); });
    } else {
      prompt('Copie o código:', code);
    }
  };

  window.buyAgain = function (orderId) {
    const order = _ordersById[orderId];
    if (!order) return;
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('cart') || '[]'); } catch (e) {}

    order.items.forEach(function (it) {
      const existing = cart.find(function (c) { return c.id === it.id && !c.tamanho && !c.cor; });
      if (existing) {
        existing.quantidade += it.quantity;
      } else {
        cart.push({
          id: it.id,
          nome: it.name,
          preco: it.unitPrice,
          precoOriginal: null,
          descontoHoje: 0,
          brinde: null,
          freteGratis: false,
          retiradaDisponivel: false,
          imagem: it.image || '',
          quantidade: it.quantity,
          tamanho: null,
          cor: null,
          sku: null,
        });
      }
    });

    localStorage.setItem('cart', JSON.stringify(cart));
    window.location.href = 'cart.html';
  };

  async function loadOrders() {
    try {
      const r = await fetch('/api/auth/orders', { headers: { 'x-auth-token': session.token } });
      if (r.status === 401) { localStorage.removeItem(AUTH_KEY); window.location.href = 'login.html'; return; }
      const data = await r.json();
      if (data.success) {
        renderOrders(data.orders);
        // Link direto de um pedido especifico (ex: veio do link do WhatsApp de envio)
        // ?pedido=<id> abre e rola ate o card daquele pedido automaticamente.
        const targetId = new URLSearchParams(window.location.search).get('pedido');
        if (targetId && document.getElementById('detail-' + targetId)) {
          window.toggleOrderDetail(targetId);
          const card = document.getElementById('toggle-' + targetId);
          if (card) setTimeout(function () { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
        }
      } else {
        document.getElementById('loading-state').textContent = 'Erro ao carregar pedidos.';
      }
    } catch(e) {
      document.getElementById('loading-state').textContent = 'Erro de conexão. Recarregue a página.';
    }
  }

  loadOrders();
})();
</script>
<script src="/js/site-config.js"></script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
